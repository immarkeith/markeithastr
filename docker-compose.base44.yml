# Base44 sandbox environment for ASTR (TanStack Start + Vite).
#
# Runs the app straight from the cloned source with Vite's dev server, so edits
# show up in the preview without rebuilding an image. ASTR has no local
# infrastructure: all data lives in an external Supabase project and market data
# comes from Alpaca, so the only thing this stack needs is environment
# variables (see .env.base44-defaults and the Base44 secrets file).

services:
  web:
    image: oven/bun:1
    working_dir: /app
    restart: on-failure
    # Dependencies live in a volume, so they are installed after the mounts are
    # in place and reused on later restarts. The client bundle needs the same
    # Supabase values as the server; only the non-prefixed names are declared as
    # Base44 secrets, so mirror them into the VITE_ names Vite reads.
    command:
      - sh
      - -ec
      - |
        export VITE_SUPABASE_URL="${SUPABASE_URL:-$VITE_SUPABASE_URL}"
        export VITE_SUPABASE_PUBLISHABLE_KEY="${SUPABASE_PUBLISHABLE_KEY:-$VITE_SUPABASE_PUBLISHABLE_KEY}"
        bun install --frozen-lockfile
        exec bunx vite dev --host 0.0.0.0 --port 3000
    ports:
      - "3000:3000"
    env_file:
      - ./.env.base44-defaults   # sandbox defaults
      - /run/base44/app.env      # Base44 secrets — last, always wins
    environment:
      - BASE44_PREVIEW_MODE
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    volumes:
      - ./:/app
      - astr-node_modules:/app/node_modules
    healthcheck:
      # Renders a real page through the SSR pipeline (/unlock always answers,
      # whether or not the passcode gate is configured).
      test:
        - CMD
        - bun
        - -e
        - fetch('http://127.0.0.1:3000/unlock').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 15s
      retries: 6
      start_period: 300s

volumes:
  astr-node_modules:
