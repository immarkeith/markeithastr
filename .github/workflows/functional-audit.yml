name: Functional audit
on:
  push:
  pull_request:
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run typecheck
      - run: bun run build
      - name: Verify Vercel output
        run: test -f .vercel/output/config.json && test -f .vercel/output/functions/__server.func/.vc-config.json
