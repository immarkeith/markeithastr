name: ASTR Autonomous Engineer Runner

# Phase K execution sandbox.
#
# Claims exactly one queued engineering task, drafts it on an isolated
# engineer/<slug> branch with the AI patch engine, runs the live-trading
# firewall, then hands the EXACT commit to a second, independent job that runs
# the full verification suite. Nothing is merged or deployed here: merging is a
# separate, human-approved action in the app.
#
# Credential isolation: this workflow only ever receives ENGINEER_* credentials.
# Live Alpaca keys are deliberately absent, and the runner aborts if it finds
# them in its environment.

on:
  workflow_dispatch:
  repository_dispatch:
    types: [engineer-task-queued]

permissions:
  contents: write
  # Publish the verification verdict as a check run on the verified commit —
  # that is what the app's approval gate re-reads before merging.
  checks: write

concurrency:
  group: astr-engineer-worker
  cancel-in-progress: false

jobs:
  run-task:
    name: Plan, patch and push
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      status: ${{ steps.runner.outputs.status }}
      task_id: ${{ steps.runner.outputs.task_id }}
      branch: ${{ steps.runner.outputs.branch }}
      sha: ${{ steps.runner.outputs.sha }}
      base_sha: ${{ steps.runner.outputs.base_sha }}
    steps:
      # Fail with the exact names instead of a bare "Input required and not
      # supplied: token" from actions/checkout.
      - name: Preflight — required Actions secrets
        env:
          SUPABASE_URL_SET: ${{ secrets.SUPABASE_URL != '' }}
          SUPABASE_SERVICE_ROLE_KEY_SET: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
          ENGINEER_LLM_API_KEY_SET: ${{ secrets.ENGINEER_LLM_API_KEY != '' }}
        run: |
          missing=""
          [ "$SUPABASE_URL_SET" = "true" ] || missing="$missing SUPABASE_URL"
          [ "$SUPABASE_SERVICE_ROLE_KEY_SET" = "true" ] || missing="$missing SUPABASE_SERVICE_ROLE_KEY"
          [ "$ENGINEER_LLM_API_KEY_SET" = "true" ] || missing="$ENGINEER_LLM_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository Actions secrets:$missing. Add them in Settings → Secrets and variables → Actions (docs/phase-k-deployment.md §2)."
            exit 1
          fi
          echo "All required Actions secrets are present."

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The Actions token can push engineer/* branches because this job asks
          # for contents: write. GITHUB_ENGINEER_TOKEN stays optional.
          token: ${{ secrets.GITHUB_ENGINEER_TOKEN || github.token }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run engineer agent
        id: runner
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ENGINEER_LLM_API_KEY: ${{ secrets.ENGINEER_LLM_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_ENGINEER_TOKEN || github.token }}
        run: bun run scripts/engineer-runner.ts

  independent-verify:
    name: Independent verification (${{ needs.run-task.outputs.sha }})
    needs: run-task
    if: needs.run-task.outputs.status == 'pushed'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The exact commit produced by the runner — never the branch tip.
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.run-task.outputs.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_ENGINEER_TOKEN || github.token }}

      - name: Assert exact commit
        run: |
          set -e
          HEAD_SHA=$(git rev-parse HEAD)
          echo "checked out $HEAD_SHA"
          test "$HEAD_SHA" = "${{ needs.run-task.outputs.sha }}"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        id: typecheck
        continue-on-error: true
        run: bunx tsc --noEmit

      # The repository carries thousands of pre-existing lint errors, so only
      # NEW errors may fail a task: count them at the task's base commit, then
      # at the verified commit, on this same machine and toolchain.
      - name: Lint errors at base commit
        id: lint_base
        continue-on-error: true
        run: |
          set -e
          git checkout -q "${{ needs.run-task.outputs.base_sha }}"
          COUNT=$(bun run scripts/engineer-lint-count.ts)
          git checkout -q "${{ needs.run-task.outputs.sha }}"
          echo "errors=$COUNT" >> "$GITHUB_OUTPUT"
          echo "base commit has $COUNT lint error(s)"

      - name: Lint
        id: lint
        continue-on-error: true
        run: |
          COUNT=$(bun run scripts/engineer-lint-count.ts)
          BASE="${{ steps.lint_base.outputs.errors }}"
          echo "errors=$COUNT" >> "$GITHUB_OUTPUT"
          echo "verified commit has $COUNT lint error(s), base had ${BASE:-0}"
          # No baseline means the base commit could not be measured — do not
          # pretend the gate passed.
          test -n "$BASE" && test "$COUNT" -le "$BASE"

      - name: Production build
        id: build
        continue-on-error: true
        run: bun run build

      - name: Record verification against the exact SHA
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TASK_ID: ${{ needs.run-task.outputs.task_id }}
          SHA: ${{ needs.run-task.outputs.sha }}
          BRANCH: ${{ needs.run-task.outputs.branch }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bun run scripts/engineer-verify.ts

      - name: Fail the job when verification failed
        if: steps.lint.outcome == 'failure' || steps.typecheck.outcome == 'failure' || steps.build.outcome == 'failure'
        run: exit 1
